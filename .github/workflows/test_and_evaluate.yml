name: Test & Evaluate (QA / Risk / Security)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MLFLOW_ENABLED: "true"
      MLFLOW_TRACKING_URI: sqlite:///mlflow-ci.db
      MLFLOW_REGISTER_MODEL: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Train model artifacts
        run: |
          python -m src.models.train_models

      - name: Run QA, risk, and security tests
        run: |
          pytest tests/ -v --cov=src --cov-report=term-missing

      - name: Enforce candidate admission
        run: python -m src.evaluation.pre_deploy_gate

      - name: Upload training lineage
        uses: actions/upload-artifact@v4
        with:
          name: adult-training-lineage
          path: |
            src/models/model_summary.json
            mlflow-ci.db
            mlruns/
